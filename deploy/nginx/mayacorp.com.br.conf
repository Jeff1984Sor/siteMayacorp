# /etc/nginx/sites-available/mayacorp.com.br
# Ativar: sudo ln -s /etc/nginx/sites-available/mayacorp.com.br /etc/nginx/sites-enabled/
# Depois: sudo nginx -t && sudo systemctl reload nginx
# HTTPS: sudo certbot --nginx -d mayacorp.com.br -d www.mayacorp.com.br --redirect
# (o Certbot adiciona os blocos 443 e o redirecionamento HTTP -> HTTPS)

upstream mayacorp_site {
    server 127.0.0.1:3010;   # mesma porta do ecosystem.config.cjs
    keepalive 16;
}

# www -> domínio raiz
server {
    listen 80;
    listen [::]:80;
    server_name www.mayacorp.com.br;
    return 301 https://mayacorp.com.br$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name mayacorp.com.br;

    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    # Arquivos estáticos com hash: cache longo
    location /_next/static/ {
        proxy_pass http://mayacorp_site;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://mayacorp_site;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
